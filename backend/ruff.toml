# 백엔드 코드 스타일 · 린트 설정 (ruff)
#   점검:   .venv\Scripts\ruff check .
#   정리:   .venv\Scripts\ruff check --fix .   /   .venv\Scripts\ruff format .
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "storage"]

[lint]
# E4/E7/E9: 문법·구문 오류, F: 미사용 import·변수 등(pyflakes), I: import 정렬, UP: 낡은 문법 현대화
select = ["E4", "E7", "E9", "F", "I", "UP"]

[lint.per-file-ignores]
# 테스트·스크립트는 sys.path 설정 등을 먼저 한 뒤 import 해야 한다
"tests/*" = ["E402"]
"scripts/*" = ["E402"]
