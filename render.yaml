# Render 배포 설계도(Blueprint) — Render에서 "New + → Blueprint"로 이 저장소를
# 선택하면 아래 설정대로 서버가 만들어진다.
# 비밀 키(OPENAI_API_KEY, DATABASE_URL)는 sync:false 라서 대시보드에서 직접 입력한다.
#
# 보안 메모
# - 이 서버는 인터넷에 공개된다. 화면의 '백엔드 설정'(API 키 · DB 주소 변경)은
#   서버 PC 자신(127.0.0.1)에서만 열리도록 막혀 있어 여기서는 기본적으로 잠긴다.
#   키 · DB 주소는 위 환경변수(Render 대시보드)로만 바꾼다.
#   원격에서 설정 화면을 꼭 쓰려면 SETTINGS_ADMIN_TOKEN 환경변수를 추가하고,
#   브라우저에 localStorage 'bredred-admin-token' 으로 같은 값을 넣는다.
# - 지금은 테스트 단계라 접속 코드(API_ACCESS_TOKEN)를 만들지 않는다. 그래서 로그인 없이
#   대시보드가 바로 열리고 기사 · 점수도 바로 보인다 (주소를 아는 사람은 누구나 볼 수 있다).
#   로그인을 켜려면 Render 대시보드 → Environment 에 API_ACCESS_TOKEN 을 직접 추가한다
#   (임의의 긴 값). 켜면 홈 화면은 열리고, 기사 · 점수는 로그인(이름 + 접속 코드) 후에 보인다.
#   이미 만들어진 서비스에 API_ACCESS_TOKEN 이 남아 있다면 Environment 에서 삭제해야 로그인이 꺼진다.
services:
  - type: web
    name: bredred-scoring
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
